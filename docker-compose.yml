services:
  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - NEXPDF_DEBUG=false
      - NEXPDF_ALLOWED_ORIGINS=${NEXPDF_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      - NEXPDF_TOKEN_SECRET=${NEXPDF_TOKEN_SECRET:?Set NEXPDF_TOKEN_SECRET in your .env file}
      - NEXPDF_MAX_FILE_SIZE_MB=25
      - NEXPDF_MAX_CONCURRENT_JOBS=4
      - NEXPDF_MAX_UPLOAD_FILES=10
      - NEXPDF_MAX_COMBINED_SIZE_MB=100
      - NEXPDF_FILE_RETENTION_MINUTES=60
    volumes:
      - pdf_uploads:/tmp/nexpdf/uploads
      - pdf_jobs:/tmp/nexpdf/jobs
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - internal
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NEXPDF_HTTP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    depends_on:
      - frontend
      - backend

volumes:
  pdf_uploads:
  pdf_jobs:

networks:
  internal:
    driver: bridge
