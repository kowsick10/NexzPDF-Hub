server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* ^/assets/.*\.[a-f0-9_-]{8,}\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
